# .github/workflows/ci-api.yml
# Ver docs/Diseño de CI CD.md sección 2.2 y 2.4.
name: CI - API

on:
  pull_request:
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/agenda_metal_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agenda_metal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

      - name: Migraciones
        run: npm run migration:run

      # Este paso es el que importa: manual-constraints.sql contiene el
      # constraint EXCLUDE de choque de horario, que Prisma no genera. Si deja
      # de aplicar limpiamente sobre el esquema migrado, la regla de negocio
      # central desaparece sin que ninguna prueba de aplicación lo note.
      - name: Constraints que Prisma no expresa
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/manual-constraints.sql

      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
