# .github/workflows/ci-web.yml
# Ver docs/Diseño de CI CD.md sección 2.1.
name: CI - Web

on:
  pull_request:
    paths: ['apps/web/**', '.github/workflows/ci-web.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/ci-web.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Todavía no hay pruebas de componentes (entran en M6); el script pasa
      # en vacío para que el paso ya esté en su lugar cuando existan.
      - run: npm run test:unit
      # Falla el PR aquí antes de que Vercel intente desplegarlo.
      - run: npm run build
