# docker-compose.yml — entorno de desarrollo local
# Frontend corre aparte con `npm run dev` (no dockerizado en local, más rápido
# el hot-reload nativo de Next.js). En producción sí se despliega en Vercel.
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agenda_metal
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: agenda_metal_dev
    # 5433 en el host para no chocar con un Postgres nativo (Homebrew) en 5432.
    # Dentro de la red de compose los servicios siguen usando postgres:5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_metal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    # En dev corremos en modo watch: compila al vuelo y no depende de un
    # dist/ pre-construido (el volumen ./apps/api:/app taparía el dist de la imagen).
    command: npm run start:dev
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://agenda_metal:dev_password@postgres:5432/agenda_metal_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev_secret_no_usar_en_produccion
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  etl-worker:
    build:
      context: ./apps/etl
    command: celery -A celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgres://agenda_metal:dev_password@postgres:5432/agenda_metal_dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/etl:/app

  etl-beat:
    build:
      context: ./apps/etl
    command: celery -A celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgres://agenda_metal:dev_password@postgres:5432/agenda_metal_dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - etl-worker

volumes:
  postgres_data:
