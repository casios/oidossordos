# apps/etl/pytest.ini
# Sin esto, `pytest` falla al importar: con el modo de importación por defecto
# el directorio que entra a sys.path es `matching/`, no la raíz del servicio,
# y `from matching.band_matcher import ...` no resuelve. Correr `python -m pytest`
# lo escondería (agrega el CWD a sys.path); esta config hace que ambas formas
# funcionen igual, en local y en CI.
[pytest]
pythonpath = .
testpaths = matching tasks
python_files = test_*.py
